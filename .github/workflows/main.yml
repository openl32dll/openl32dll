name: Profil Guncelleme Motoru

on:
  schedule:
    # Her saat başı otomatik çalışır
    - cron: '0 * * * *'
  workflow_dispatch: # İstediğimiz an elle başlatabilmek için

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kontrol Et
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Profili Guncelle
        run: python update_profile.py

      - name: Degisiklikleri Kaydet
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "Profil otomatik güncellendi" || exit 0
          git push
